# Production stack. Does not replace docker-compose.yml — that file stays the
# local developer loop (published Postgres/Redis, bind-mounts, --reload).
#
#   PUBLIC_HOST=mleng.example.com docker compose -f docker-compose.prod.yml up -d
#
# Caddy terminates TLS (Let's Encrypt when PUBLIC_HOST is a real DNS name) and
# serves the UI and API on the same host. Postgres and Redis are not published.
# Set SESSION_SECRET, Google credentials, and a non-default POSTGRES_PASSWORD
# in .env before this is reachable from the internet.

name: mleng-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mleng}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mleng}
      POSTGRES_DB: ${POSTGRES_DB:-mleng}
    volumes:
      - mleng_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mleng} -d ${POSTGRES_DB:-mleng}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - mleng_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    environment:
      ENVIRONMENT: production
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST is required (the DNS name Caddy serves)}
      DATABASE_URL: postgresql://${POSTGRES_USER:-mleng}:${POSTGRES_PASSWORD:-mleng}@postgres:5432/${POSTGRES_DB:-mleng}
      REDIS_URL: redis://redis:6379/0
      MLENG_DATA_DIR: /app/data
      OAUTH_REDIRECT_URL: https://${PUBLIC_HOST}/auth/callback
      POST_LOGIN_REDIRECT: https://${PUBLIC_HOST}
      CORS_ORIGINS: https://${PUBLIC_HOST}
      DEV_LOGIN_ENABLED: "false"
    volumes:
      - mleng_userdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
      - --no-access-log
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-mleng}:${POSTGRES_PASSWORD:-mleng}@postgres:5432/${POSTGRES_DB:-mleng}
      REDIS_URL: redis://redis:6379/0
      MLENG_DATA_DIR: /app/data
    volumes:
      - mleng_userdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      args:
        # Baked in at build. Rebuild the frontend image if PUBLIC_HOST changes.
        NEXT_PUBLIC_API_URL: https://${PUBLIC_HOST}
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST is required}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  mleng_pgdata:
  mleng_redisdata:
  mleng_userdata:
  caddy_data:
  caddy_config:
