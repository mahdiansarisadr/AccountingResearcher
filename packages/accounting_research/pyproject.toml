[project]
name = "accounting-research"
version = "0.1.0"
description = "Accounting Research Assistant — text-to-SQL agent with citations"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.6.0",
    "langsmith>=0.3.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
ar-seed = "accounting_research.ingestion.seed:main"
ar-catalog = "accounting_research.retrieval.catalog:main"
ar-chat = "accounting_research.interfaces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accounting_research"]
