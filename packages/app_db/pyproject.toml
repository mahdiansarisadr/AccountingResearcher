[project]
name = "app-db"
version = "0.1.0"
description = "SQLAlchemy models and sessions for the application schema, shared by the API and the worker"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    # psycopg 3, matching the driver the rest of the project uses.
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_db"]
