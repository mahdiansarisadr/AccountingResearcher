[project]
name = "run-bus"
version = "0.1.0"
description = "Redis transport for agent run events, shared by the API and the worker"
requires-python = ">=3.11"
dependencies = [
    # For the RunEvent contract that travels over the bus.
    "mleng",
    "redis>=5.0",
]

[tool.uv.sources]
mleng = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/run_bus"]
