[project]
name = "accounting-workspace"
version = "0.0.0"
description = "Workspace root for the Accounting Research Assistant (agent + services)."
requires-python = ">=3.11"
# Depend on the workspace members so `uv sync` / `uv run` keep them installed in
# the shared environment (the root itself is not a shipped package).
dependencies = [
    "accounting-research",
    "run-bus",
    "api",
    "worker",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
accounting-research = { workspace = true }
run-bus = { workspace = true }
api = { workspace = true }
worker = { workspace = true }
