[project]
name = "accounting-workspace"
version = "0.0.0"
description = "Workspace root for the Accounting Research Assistant (agent + services)."
requires-python = ">=3.11"
# Depend on the workspace members so `uv sync` / `uv run` keep them installed in
# the shared environment (the root itself is not a shipped package).
dependencies = [
    "accounting-research",
    "app-db",
    "run-bus",
    "api",
    "worker",
]

[tool.uv]
package = false

[dependency-groups]
# Test-only, installed by `uv sync` and excluded from images via `--no-dev`.
dev = [
    "pytest>=8.2",
    # TestClient's transport.
    "httpx>=0.27",
    # An in-process Redis, so the run bus can be tested without a server.
    "fakeredis>=2.23",
]

[tool.uv.workspace]
members = ["packages/*", "services/api", "services/worker"]

[tool.uv.sources]
accounting-research = { workspace = true }
app-db = { workspace = true }
run-bus = { workspace = true }
api = { workspace = true }
worker = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that need Postgres skip themselves when it is unreachable; this makes
# them visible as skips rather than silent absences.
addopts = "-ra"
