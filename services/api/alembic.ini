# Alembic configuration for the application schema.
#
# Deliberately no sqlalchemy.url here: the database URL is read from the
# environment by migrations/env.py, so credentials never live in a tracked file
# and migrations always target the same database the API itself uses.
#
# Run from the repo root:  make migrate / make migration name="..."
# or directly:            alembic -c services/api/alembic.ini upgrade head

[alembic]
# %(here)s is this file's directory, so the path works from any working dir.
script_location = %(here)s/migrations

path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
