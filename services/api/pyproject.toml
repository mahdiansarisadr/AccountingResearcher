[project]
name = "api"
version = "0.1.0"
description = "HTTP API for the Accounting Research Assistant"
requires-python = ">=3.11"
dependencies = [
    # Workspace cross-link: the API runs the agent in-process (Phase 1 onward).
    "accounting-research",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    # Shared Redis conventions for enqueuing runs and reading their events.
    "run-bus",
    "rq>=1.16",
    # The API owns the application schema, so it owns the migrations.
    "alembic>=1.13",
]

[tool.uv.sources]
accounting-research = { workspace = true }
run-bus = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
