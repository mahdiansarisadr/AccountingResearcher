[project]
name = "api"
version = "0.1.0"
description = "HTTP API for MLEng"
requires-python = ">=3.11"
dependencies = [
    # Workspace cross-link: the API shares the agent's event contract.
    "mleng",
    # Models and sessions for the application schema (run records).
    "app-db",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    # Shared Redis conventions for enqueuing runs and reading their events.
    "run-bus",
    "rq>=1.16",
    # The API owns the application schema, so it owns the migrations.
    "alembic>=1.13",
    # Google OAuth: discovery, the authorization code exchange, and ID token
    # verification against Google's signing keys.
    "authlib>=1.3",
    # Signs the short-lived cookie Authlib uses to carry OAuth state and nonce
    # across the redirect to Google (Starlette's SessionMiddleware).
    "itsdangerous>=2.2",
    # Signs and verifies our own session cookie. Authlib's own JWT module is
    # deprecated in favour of this, and it arrives with Authlib either way.
    "joserfc>=1.0",
    "sentry-sdk[fastapi]>=2.0",
]

[tool.uv.sources]
mleng = { workspace = true }
app-db = { workspace = true }
run-bus = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
