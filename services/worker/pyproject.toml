[project]
name = "worker"
version = "0.1.0"
description = "Background worker that executes agent runs"
requires-python = ">=3.11"
dependencies = [
    # Workspace cross-link: the worker runs the agent in-process (Phase 1 onward).
    "accounting-research",
    "pydantic-settings>=2.4",
    "redis>=5.0",
]

[project.scripts]
ar-worker = "worker.main:main"

[tool.uv.sources]
accounting-research = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
