[project]
name = "worker"
version = "0.1.0"
description = "Background worker that executes agent runs"
requires-python = ">=3.11"
dependencies = [
    # Workspace cross-link: the worker runs the agent in-process.
    "accounting-research",
    # The worker records each run's outcome in the application schema.
    "app-db",
    # Shared Redis conventions for publishing run events.
    "run-bus",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "rq>=1.16",
]

[project.scripts]
ar-worker = "worker.main:main"

[tool.uv.sources]
accounting-research = { workspace = true }
app-db = { workspace = true }
run-bus = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
