# Authored table/column descriptions for the demo/test database.
#
# Source of truth for the schema catalog: the catalog builder
# (accounting_research.retrieval.catalog) reads this file, generates embeddings,
# and populates the `schema_catalog` Postgres table used for table selection.
#
# In Phase 4, the ingestion pipeline would generate these descriptions from real
# data instead of them being hand-authored here.

# Provenance columns carried by every table (TDD 4.3 provenance model).
provenance_columns:
  source_file: "Original source file this record was loaded from."
  source_type: "Source format: excel, pdf, or image."
  locator: "Where in the source the record lives (sheet!cell, page, region)."
  ingested_at: "When the record was loaded into the store."

tables:
  departments:
    description: "Company departments / cost centers (Finance, Engineering, Sales, etc.)."
    columns:
      dept_id: "Primary key for the department."
      dept_name: "Department name, e.g. Finance, Engineering, Sales, HR."

  employees:
    description: "Employees, their role, and the department they belong to."
    columns:
      emp_id: "Primary key for the employee."
      full_name: "Employee full name."
      dept_id: "Department the employee belongs to (FK departments.dept_id)."
      role: "Job title / role."
      hire_date: "Date the employee was hired."

  vendors:
    description: "Suppliers/vendors the company pays, with the kind of goods/services they provide."
    columns:
      vendor_id: "Primary key for the vendor."
      vendor_name: "Vendor / supplier name."
      vendor_category: "Kind of vendor: Travel Agency, Software, Consulting, Catering, etc."

  expenses:
    description: >-
      Employee and departmental spending transactions — travel (T&E), meals,
      software, training, office supplies, consulting. The canonical source for
      spend/cost questions and spending trends.
    columns:
      expense_id: "Primary key for the expense line."
      emp_id: "Employee who incurred the expense (FK employees.emp_id)."
      dept_id: "Department the expense is booked to (FK departments.dept_id)."
      category: "Expense category: Travel, Meals, Software, Training, Office Supplies, Consulting."
      amount: "Expense amount in the given currency."
      currency: "Currency code, e.g. USD."
      expense_date: "Date the expense was incurred."
      description: "Free-text description of the expense."
      vendor_id: "Vendor paid, if any (FK vendors.vendor_id)."

  invoices:
    description: "Accounts-payable invoices received from vendors, with amounts and payment status."
    columns:
      invoice_id: "Primary key for the invoice."
      vendor_id: "Vendor that issued the invoice (FK vendors.vendor_id)."
      amount: "Invoice amount."
      invoice_date: "Date the invoice was issued."
      due_date: "Date payment is due."
      status: "Payment status: paid, unpaid, or overdue."

  audit_cases:
    description: >-
      Audit engagements/cases and their audit status. Use this to find cases that
      are not yet audited, in progress, or completed.
    columns:
      case_id: "Primary key for the audit case."
      entity: "Entity / account / area under audit."
      fiscal_year: "Fiscal year the case relates to."
      audit_status: "Audit status: not_audited, in_progress, or audited."
      assigned_to: "Auditor assigned to the case."
      opened_date: "Date the case was opened."
      closed_date: "Date the case was closed (null if still open)."

  budgets:
    description: "Planned budget amounts by department, fiscal year, and category (for budget vs. actual)."
    columns:
      budget_id: "Primary key for the budget line."
      dept_id: "Department the budget belongs to (FK departments.dept_id)."
      fiscal_year: "Fiscal year of the budget."
      category: "Budget category, aligned to expense categories."
      budget_amount: "Planned budget amount for the category/year."

  payroll:
    description: "Payroll runs per employee per pay period (gross and net pay)."
    columns:
      payroll_id: "Primary key for the payroll line."
      emp_id: "Employee paid (FK employees.emp_id)."
      dept_id: "Department the pay is booked to (FK departments.dept_id)."
      pay_period: "Pay period date (month)."
      gross_pay: "Gross pay for the period."
      net_pay: "Net pay for the period after deductions."

  purchase_orders:
    description: "Purchase orders raised to vendors, with amount and fulfillment status."
    columns:
      po_id: "Primary key for the purchase order."
      vendor_id: "Vendor the PO is raised to (FK vendors.vendor_id)."
      dept_id: "Department raising the PO (FK departments.dept_id)."
      amount: "PO amount."
      order_date: "Date the PO was raised."
      status: "PO status: open, received, or cancelled."

  office_assets:
    description: "Fixed office assets/equipment owned by departments (laptops, furniture, etc.)."
    columns:
      asset_id: "Primary key for the asset."
      dept_id: "Department that owns the asset (FK departments.dept_id)."
      asset_type: "Type of asset: Laptop, Monitor, Desk, Chair, Printer."
      purchase_cost: "Original purchase cost of the asset."
      purchase_date: "Date the asset was purchased."
